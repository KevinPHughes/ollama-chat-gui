<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module Test</title>
</head>
<body>
    <h1>Testing Modular Structure</h1>
    <div id="output"></div>
    
    <script type="module">
        import { CONSTANTS } from './js/utils/constants.js';
        import { Utils } from './js/utils/utils.js';
        import { DOMManager } from './js/managers/DOMManager.js';
        
        console.log('Constants loaded:', Object.keys(CONSTANTS));
        console.log('Utils loaded:', Object.getOwnPropertyNames(Utils.prototype || Utils));
        
        document.getElementById('output').innerHTML = `
            <p>✅ Constants module loaded successfully</p>
            <p>✅ Utils module loaded successfully</p>
            <p>✅ DOMManager module loaded successfully</p>
            <p>All modules are working correctly!</p>
        `;
    </script>
</body>
</html>
