<!DOCTYPE html>
<html>

<head>
  <title>Ollama Chatbot</title>
  <style>
    body {
      font-family: sans-serif;
    }

    #chat-area {
      width: 80%;
      height: 400px;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: scroll;
      /* Enable scrolling if content overflows */
    }

    #message-input {
      width: 80%;
      padding: 5px;
    }

    #send-button {
      padding: 5px 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    #send-button:hover {
      background-color: #3e8e41;
    }

    /* Loading indicator styles */
    .loading-bubble {
      background-color: #f0f0f0;
      border-radius: 18px;
      padding: 12px 16px;
      margin: 5px 0;
      display: inline-block;
      position: relative;
    }

    .loading-dots {
      display: inline-block;
    }

    .loading-dots::after {
      content: '';
      display: inline-block;
      width: 0;
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0% { content: ''; }
      25% { content: '.'; }
      50% { content: '..'; }
      75% { content: '...'; }
      100% { content: ''; }
    }

    .user-message {
      background-color: #eee;
      margin-bottom: 5px;
      padding: 8px;
      border-radius: 8px;
    }

    .bot-message {
      background-color: #ddd;
      margin-bottom: 5px;
      padding: 8px;
      border-radius: 8px;
    }
  </style>
</head>

<body>
  <h1>Ollama Chatbot</h1>
  <div id="chatArea">
    <div id="responseArea"></div>
  </div>
  <input type="text" id="chatInput" placeholder="Enter your message">
  <button id="send-button">Send</button>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>

    const chatInput = document.getElementById('chatInput');
    const responseArea = document.getElementById('responseArea');
    const marked = window.marked; // Access the marked library

    const chatArea = document.getElementById('chatArea');
    const sendButton = document.getElementById('send-button');

    chatInput.addEventListener('keypress', function (event) {
      if (event.key === 'Enter') {
        event.preventDefault(); // Prevent the default form submission

        // Get the text from the textbox
        const message = chatInput.value;

        // Add user message to chat
        const humanEntry = document.createElement('div');
        humanEntry.textContent = "You: " + message;
        humanEntry.className = 'user-message';
        chatArea.appendChild(humanEntry);

        // Show loading indicator
        const loadingElement = document.createElement('div');
        loadingElement.className = 'loading-bubble';
        loadingElement.innerHTML = 'Bot: <span class="loading-dots">Thinking</span>';
        chatArea.appendChild(loadingElement);

        // Clear input and scroll to bottom
        chatInput.value = '';
        chatArea.scrollTop = chatArea.scrollHeight;

        // Send the message to the server
        fetch('/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message: message })
        })
          .then(response => response.json())
          .then(data => {
            // Remove loading indicator
            loadingElement.remove();
            
            const botResponse = data.message.message.content;
            // Display the bot's response
            const botResponseElement = document.createElement('div');
            botResponseElement.innerHTML = "Bot: " + marked.parse(botResponse);
            botResponseElement.className = 'bot-message';
            chatArea.appendChild(botResponseElement);
            
            // Scroll to bottom
            chatArea.scrollTop = chatArea.scrollHeight;
          })
          .catch(error => {
            console.error('Error:', error);
            // Remove loading indicator and show error
            loadingElement.remove();
            const errorElement = document.createElement('div');
            errorElement.textContent = "Bot: Sorry, there was an error processing your message.";
            errorElement.className = 'bot-message';
            errorElement.style.color = '#d32f2f';
            chatArea.appendChild(errorElement);
            chatArea.scrollTop = chatArea.scrollHeight;
          });
      }
    });
  </script>
</body>

</html>
