<!DOCTYPE html>
<html lang="en">

<head>
  <title>Kevin's Chat Assistant</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="streaming.css">
</head>

<body>
  <div class="chat-container">
    <!-- Mobile sidebar backdrop -->
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
    
    <!-- Desktop Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Kevin's Chat Assistant</h1>
        <div class="sidebar-header-controls">
          <!-- Sidebar collapse toggle -->
          <button id="sidebarCollapseToggle" class="sidebar-collapse-toggle" aria-label="Collapse sidebar" title="Collapse sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <!-- Theme toggle button -->
          <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode" title="Toggle light/dark mode">
            <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
        </div>
      </div>
      
      <div class="sidebar-content">
        <!-- New Chat Section -->
        <div class="sidebar-section always-visible">
          <button id="newConversationBtn" class="new-chat-button" aria-label="Start new conversation" title="Start a new conversation">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14m-7-7h14"></path>
            </svg>
            <span>New Chat</span>
          </button>
        </div>

        <!-- Model Selection -->
        <div class="sidebar-section">
          <h3>Model</h3>
          <div class="model-selector-container">
            <select id="modelSelector" class="model-selector">
              <!-- Models will be populated dynamically from config -->
            </select>
          </div>
        </div>

        <!-- System Prompt -->
        <div class="sidebar-section">
          <h3>System Prompt</h3>
          <div class="system-prompt-container">
            <select id="savedPromptsSelector" class="saved-prompts-selector">
              <option value="">Load saved prompt...</option>
            </select>
            <textarea id="systemPromptInput" class="system-prompt-input"
              placeholder="Enter instructions for the AI model (e.g., 'You are a helpful assistant...')"></textarea>
          </div>
        </div>

        <!-- Conversation History -->
        <div class="sidebar-section">
          <h3>History</h3>
          <button id="savedConversationsBtn" class="new-chat-button" style="background-color: var(--secondary-color); color: var(--text-color);" aria-label="View saved conversations" title="View saved conversations">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3h18v18H3zM9 9h6m-6 4h6"></path>
            </svg>
            View Conversations
          </button>
        </div>
      </div>
    </aside>

    <!-- Mobile Header (hidden on desktop) -->
    <header class="mobile-header">
      <h1>Kevin's Chat Assistant</h1>
      <div class="mobile-controls">
        <button id="mobileNewChatBtn" class="mobile-new-chat-btn" aria-label="Start new conversation" title="Start new conversation">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14m-7-7h14"></path>
          </svg>
        </button>
        <button id="mobileMenuToggle" class="theme-toggle" aria-label="Toggle menu" title="Toggle menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Chat Area -->
    <div class="main-area">
      <!-- Main chat area for messages -->
      <main id="chatMessages" class="chat-messages" aria-live="polite"></main>

      <!-- Chat input area -->
      <footer class="chat-input-container">
      <textarea id="chatInput" class="chat-input" placeholder="Type a message..." aria-label="Type your message"></textarea>
      <button id="sendButton" class="send-button" aria-label="Send message">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
      </footer>
    </div>

    <!-- Scroll to Top Button -->
    <button id="scrollToTop" class="scroll-to-top" aria-label="Scroll to top" title="Scroll to top">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </button>
  </div>

  <!-- Conversation History Modal -->
  <div id="conversationModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Conversation History</h2>
        <span class="close-button" id="closeModal">&times;</span>
      </div>
      <div class="modal-body">
        <div id="conversationList" class="conversation-list">
          <!-- Conversations will be populated here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script type="module" src="js/ChatApplication.js"></script>
</body>

</html>
